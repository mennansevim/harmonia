# Clean install → Today tab with the choir rehearsal goal (WIDE-01), which
# ticks the choir box so the Koro tab exists. No mic or reminder prompt.
appId: com.mennansevim.vocalart
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*her gün geliştir"
    timeout: 20000
- scrollUntilVisible:
    element: "Başlayalım"
    direction: DOWN
- tapOn: "Başlayalım"
- tapOn: "Koro provasına hazırlanmak"
- tapOn: "Devam"
- tapOn: "Devam"
- scrollUntilVisible:
    element: "Ana sayfaya git"
    direction: DOWN
- tapOn: "Ana sayfaya git"
- extendedWaitUntil:
    visible: "Bugün"
    timeout: 8000
