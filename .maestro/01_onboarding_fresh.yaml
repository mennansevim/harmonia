# Fresh install: welcome through every onboarding step to the Today tab.
# Text selectors only; Flutter Keys are not exposed to the accessibility tree.
appId: com.mennansevim.vocalart
name: Onboarding — temiz kurulum
tags: [smoke, critical]
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*her gün geliştir"
    timeout: 20000
- scrollUntilVisible:
    element: "Başlayalım"
    direction: DOWN
- takeScreenshot: onboarding_01_welcome
- tapOn: "Başlayalım"
# WIDE-01: goal → minutes → ready; no microphone, range or reminder step.
- assertVisible: "Ne için çalışıyorsun?"
- takeScreenshot: onboarding_02_goal_empty
- tapOn: "Koro provasına hazırlanmak"
- takeScreenshot: onboarding_03_goal_selected
- tapOn: "Devam"
- assertVisible: "Günde kaç dakika ayırabilirsin?"
- assertNotVisible: "Mikrofonunu deneyelim"
- takeScreenshot: onboarding_07_minutes
- tapOn: "Devam"
- assertVisible: "Planın kuruldu"
- assertVisible: "Koro provasına hazırlanmak"
- assertNotVisible: "Günlük hatırlatma ister misin?"
- assertVisible: ".*10 dakika.*"
- takeScreenshot: onboarding_09_ready
- scrollUntilVisible:
    element: "Ana sayfaya git"
    direction: DOWN
- tapOn: "Ana sayfaya git"
- extendedWaitUntil:
    visible: "Bugün"
    timeout: 8000
- takeScreenshot: today_first_run
# Cold restart keeps the finished onboarding.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Bugün"
    timeout: 15000
- assertNotVisible: "Başlayalım"
